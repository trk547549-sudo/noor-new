name: Noor APK TEST

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare signing key
        env:
          NOOR_KEYSTORE_BASE64: ${{ secrets.NOOR_KEYSTORE_BASE64 }}
        run: |
          echo "$NOOR_KEYSTORE_BASE64" | base64 --decode > noor-release.jks

      - name: Build signed APK
        env:
          NOOR_KEYSTORE_PATH: ${{ github.workspace }}/noor-release.jks
          NOOR_KEY_ALIAS: ${{ secrets.NOOR_KEY_ALIAS }}
          NOOR_KEY_PASSWORD: ${{ secrets.NOOR_KEY_PASSWORD }}
          NOOR_STORE_PASSWORD: ${{ secrets.NOOR_STORE_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoorNew-APK
          path: app/build/outputs/apk/release/app-release.apk
